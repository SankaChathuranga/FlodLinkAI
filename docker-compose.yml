version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: floodlink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: floodlink
      POSTGRES_USER: floodlink
      POSTGRES_PASSWORD: floodlink_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - floodlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodlink"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  floodlink_pgdata:
    driver: local
