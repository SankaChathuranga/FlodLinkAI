name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""
      release_name:
        description: "Release title"
        required: false
        default: ""
      draft:
        description: "Create as draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Mobile Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable channel)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Determine Release Information
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_NAME: ${{ inputs.release_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.${{ github.run_number }}"
          fi

          if [ -n "$INPUT_NAME" ]; then
            NAME="$INPUT_NAME"
          else
            NAME="FloodLink $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ secrets.FLOODLINK_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository secret FLOODLINK_API_BASE_URL is not set; the APK would point at localhost."
            exit 1
          fi
          flutter build apk --release \
            --dart-define=FLOODLINK_API_BASE_URL="$API_BASE_URL"

      - name: Rename APK
        run: |
          cp \
            mobile/build/app/outputs/flutter-apk/app-release.apk \
            mobile/build/app/outputs/flutter-apk/floodlink-${{ steps.release.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/floodlink-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
