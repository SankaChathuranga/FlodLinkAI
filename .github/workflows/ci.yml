name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------
  # Job 1 - Backend (.NET / xUnit)
  # -----------------------------------------------------------
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # Use the wildcard form so the runner picks up whatever 10.0.x
          # patch SDK is available, matching the rollForward intent in global.json.
          # (Exact "10.0.0" causes a 404 because the published SDK has a patch suffix.)
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore ../FloodLink.sln

      - name: Build (fail on any error)
        run: dotnet build ../FloodLink.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ../FloodLink.sln --no-build --configuration Release --verbosity normal

  # -----------------------------------------------------------
  # Job 2 - Web (Node / Vite)
  # -----------------------------------------------------------
  web:
    name: Web - Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (fail on any build error)
        run: npm run build

  # -----------------------------------------------------------
  # Job 3 - Mobile (Flutter)
  # -----------------------------------------------------------
  mobile:
    name: Mobile - Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable channel)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (static analysis - catches type errors and lint violations)
        run: flutter analyze --fatal-infos
