name: floodlink_mobile
description: "FloodLink AI — Field Volunteer Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Provider only (see CONTRIBUTING.md).
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Camera / Image evidence
  image_picker: ^1.1.2

  # Location / GPS
  geolocator: ^13.0.1

  # HTTP API client
  http: ^1.2.2

  # UI Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
